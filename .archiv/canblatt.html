<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<title>CANBLATT – Realistisches 3D Cannabis Blatt</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 90% at 30% 20%,#0f2217 0%,#07100b 45%,#030504 100%)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas#c.leaf{cursor:pointer}canvas#c.grab{cursor:grabbing}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
#hud{position:fixed;left:16px;top:16px;border-radius:18px;padding:12px 16px;display:flex;gap:14px;align-items:center;z-index:5;max-width:calc(100vw - 90px)}
#logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g3),var(--g2) 60%,#065f46);display:grid;place-items:center;flex:none;box-shadow:0 6px 20px rgba(34,197,94,.35)}
#logo svg{width:24px;height:24px}
#hud h1{font-size:16px;letter-spacing:.22em;font-weight:800;background:linear-gradient(90deg,#eaffef,var(--g) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
#stats{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats b{color:var(--g);font-weight:600}
#panel{position:fixed;right:16px;top:16px;bottom:16px;width:336px;border-radius:22px;display:flex;flex-direction:column;z-index:6;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;overflow:hidden}
#panel.hide{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 10px 8px 10px;margin-right:46px;border-bottom:1px solid var(--line)}
#tabs button{all:unset;cursor:pointer;text-align:center;padding:8px 2px;border-radius:11px;font-size:11.5px;font-weight:600;color:var(--mut);transition:.2s}
#tabs button:hover{color:var(--tx);background:rgba(255,255,255,.05)}
#tabs button.on{color:#04140a;background:linear-gradient(135deg,var(--g3),var(--g));box-shadow:0 4px 14px rgba(74,222,128,.3)}
#body{flex:1;overflow-y:auto;padding:12px 14px 18px;scrollbar-width:thin;scrollbar-color:rgba(74,222,128,.35) transparent}
.page{display:none}.page.on{display:block;animation:fd .25s}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.sec{margin:6px 0 14px;padding:12px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.06)}
.sec h3{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:7px}
.sec h3:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
.row{margin:9px 0}
.row label{display:flex;justify-content:space-between;margin-bottom:5px;color:#c9dccf;font-size:12px}
.row label span{color:var(--g);font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--g2),var(--g3)) 0/var(--p) 100% no-repeat,rgba(255,255,255,.1)}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--g2),var(--g3))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5.5px;border-radius:50%;background:#f0fff4;border:3px solid var(--g);box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#f0fff4;border:3px solid var(--g)}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.28);padding:3px;border-radius:11px;border:1px solid rgba(255,255,255,.05)}
.seg button{all:unset;flex:1;text-align:center;padding:6px 2px;border-radius:8px;cursor:pointer;font-size:11.5px;color:var(--mut);font-weight:600;transition:.18s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:linear-gradient(135deg,rgba(163,230,53,.28),rgba(34,197,94,.3));color:#eaffef;box-shadow:inset 0 0 0 1px rgba(74,222,128,.45)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{all:unset;cursor:pointer;text-align:center;padding:8px 6px;border-radius:10px;font-size:11.5px;font-weight:600;color:#d9efe0;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);transition:.18s}
.btn:hover{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.4)}
.btn.pri{background:linear-gradient(135deg,var(--g3),var(--g));color:#04140a;border-color:transparent}
.chk{display:flex;justify-content:space-between;align-items:center;margin:9px 0;color:#c9dccf;font-size:12px;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:34px;height:19px;border-radius:20px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:.2s;flex:none}
.chk input:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#dfeee4;transition:.2s}
.chk input:checked{background:linear-gradient(90deg,var(--g2),var(--g))}
.chk input:checked:after{left:17px}
.note{color:var(--mut);font-size:11px;margin-top:6px}
#tog{position:fixed;right:26px;top:25px;z-index:7;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--g);font-size:17px;border:1px solid var(--line);background:rgba(10,20,14,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#hint{position:fixed;left:16px;bottom:16px;border-radius:14px;padding:9px 14px;color:var(--mut);font-size:11.5px;z-index:4;max-width:min(560px,calc(100vw - 32px))}
#hint b{color:var(--g);font-weight:600}
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0d2014,#030504 70%);transition:opacity .6s}
#load.busy{background:rgba(3,6,4,.45);backdrop-filter:blur(6px)}
#load.off{opacity:0;pointer-events:none}
#load div{text-align:center;color:var(--mut);letter-spacing:.14em;font-size:12px;max-width:80vw}
#load i{display:block;width:46px;height:46px;margin:0 auto 16px;border-radius:50%;border:3px solid rgba(74,222,128,.15);border-top-color:var(--g);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:760px){#panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:52vh}#panel.hide{transform:translateY(calc(100% + 20px))}#tog{right:18px;top:auto;bottom:calc(52vh - 38px)}#panel.hide~#tog{bottom:18px}#hint{display:none}#hud{left:8px;top:8px}}
</style>
